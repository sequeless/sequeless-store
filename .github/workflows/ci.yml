name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    uses: sequeless/sequeless-build/.github/workflows/maven-ci.yml@8cebaa03c8ba188b31f6c0c7b4c4bb0e2c9dacd2 # workflows-v0.1.3
    secrets: inherit

  # The release runs javadoc under -Prelease and fails on any unresolved {@link}. Run the same
  # profile on every PR so that error fails here, not at release time.
  javadoc:
    name: javadoc (release profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Release-profile javadoc
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -Prelease -DskipTests package
