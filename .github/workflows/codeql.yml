name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    uses: sequeless/sequeless-build/.github/workflows/maven-codeql.yml@8cebaa03c8ba188b31f6c0c7b4c4bb0e2c9dacd2 # workflows-v0.1.3
    with:
      languages: '["java-kotlin"]'
    secrets: inherit
